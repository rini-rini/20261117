<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算機</title>
    <link rel="stylesheet" href="./css/hw1-計算機.css">
</head>

<body>
    <div class="all">
        <img  class="bg"  src="./img/背景.jpg" alt="背景圖片">
        <div class="nav">
            <div class="show"></div>
        </div>
        <div class="banner">
            <div class="btn-area">
                <button class="btn btn-fn">%</button>
                <button class="btn btn-fn">√</button>
                <button class="btn btn-fn">c</button>
                <button class="btn btn-fn">←</button>

                <button class="btn btn-nb">7</button>
                <button class="btn btn-nb">8</button>
                <button class="btn btn-nb">9</button>
                <button class="btn btn-fn">/</button>

                <button class="btn btn-nb">4</button>
                <button class="btn btn-nb">5</button>
                <button class="btn btn-nb">6</button>
                <button class="btn btn-fn">*</button>

                <button class="btn btn-nb">1</button>
                <button class="btn btn-nb">2</button>
                <button class="btn btn-nb">3</button>
                <button class="btn btn-fn">-</button>

                <button class="btn btn-nb">0</button>
                <button class="btn btn-nb">.</button>
                <button class="btn btn-fn">=</button>
                <button class="btn btn-fn">+</button>
            </div>
        </div>
    </div>
</body>

</html>
